<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Bar Patio La China</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <!-- Fondo decorativo -->
        <div class="login-bg">
            <div class="bg-pattern"></div>
        </div>

        <!-- Formulario de login -->
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <span class="logo-icon">B</span>
                </div>
                <h1 class="login-title">Bar Patio La China</h1>
                <p class="login-subtitle">Sistema de Conciliación de Remesas</p>
            </div>

            <!-- Formulario Login -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email" class="form-label required">Correo Electrónico</label>
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="tu@email.com"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label required">Contraseña</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="••••••••"
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkmark"></span>
                        Recordarme
                    </label>
                    <a href="#" class="forgot-link" onclick="showForgotPassword()">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    <span class="btn-text">Iniciar Sesión</span>
                    <span class="btn-loading hidden">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>

                <div id="loginError" class="error-message hidden">
                    <i class="fas fa-exclamation-circle"></i>
                    <span></span>
                </div>
            </form>

            <!-- Formulario Recuperar Contraseña -->
            <form id="forgotForm" class="login-form hidden">
                <div class="back-link">
                    <a href="#" onclick="showLogin()">
                        <i class="fas fa-arrow-left"></i> Volver al login
                    </a>
                </div>

                <h2 class="form-title">Recuperar Contraseña</h2>
                <p class="form-description">
                    Ingresa tu correo electrónico y te enviaremos las instrucciones para restablecer tu contraseña.
                </p>

                <div class="form-group">
                    <label for="forgotEmail" class="form-label required">Correo Electrónico</label>
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                        <input 
                            type="email" 
                            id="forgotEmail" 
                            name="forgotEmail" 
                            class="form-input" 
                            placeholder="tu@email.com"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="forgotBtn">
                    <span class="btn-text">Enviar Instrucciones</span>
                    <span class="btn-loading hidden">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>

                <div id="forgotSuccess" class="success-message hidden">
                    <i class="fas fa-check-circle"></i>
                    <span>Si el email existe, recibirás instrucciones de recuperación.</span>
                </div>

                <div id="forgotError" class="error-message hidden">
                    <i class="fas fa-exclamation-circle"></i>
                    <span></span>
                </div>
            </form>
        </div>

        <!-- Theme toggle -->
        <button class="theme-toggle-login" onclick="toggleTheme()">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <!-- Toast container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="/js/theme.js?v=5"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
